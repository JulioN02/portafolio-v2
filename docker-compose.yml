services:
  postgres:
    image: postgres:15-alpine
    container_name: portafolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-julion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-portafolio_v2}
    ports:
      # Bind to localhost only — the DB must never be reachable from the network.
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-julion} -d ${POSTGRES_DB:-portafolio_v2}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - portafolio-network

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: portafolio-api
    restart: unless-stopped
    # Port 3000 is NOT published to the host: the API is reachable only inside
    # the compose network (frontends proxy to `api:3000`). Uncomment and bind to
    # 127.0.0.1 only if you explicitly need host access for local debugging.
    # ports:
    #   - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:?Set CORS_ORIGIN in .env}
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/api/uploads
    networks:
      - portafolio-network

  admin-panel:
    build:
      context: .
      dockerfile: admin-panel/Dockerfile
    container_name: portafolio-admin
    restart: unless-stopped
    ports:
      - "5175:80"
    depends_on:
      - api
    networks:
      - portafolio-network

  client-site:
    build:
      context: .
      dockerfile: client-site/Dockerfile
    container_name: portafolio-client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api
    networks:
      - portafolio-network

  recruiter-site:
    build:
      context: .
      dockerfile: recruiter-site/Dockerfile
    container_name: portafolio-recruiter
    restart: unless-stopped
    ports:
      - "5174:80"
    depends_on:
      - api
    networks:
      - portafolio-network

volumes:
  postgres_data:
  uploads_data:

networks:
  portafolio-network:
    driver: bridge
